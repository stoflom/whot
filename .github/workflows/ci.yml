name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:   # allow manual re-runs from the Actions tab
  schedule:
    - cron: "0 3 * * *"   # nightly: the python-heavy job exercises the
                          # optional decode/detector deps (#314)

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test   # the vitest suite (#312)

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # generate_context! embeds ../dist — build the frontend first
      - run: npm ci && npm run build
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo test
        working-directory: src-tauri
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # blake3 is a hard dependency of the harvest tests (#310); pytest is
      # the repo-standard runner (AGENTS.md §Testing) — unittest discovery
      # silently skipped the pytest-style test_resolve_env.py (#313)
      - run: pip install numpy blake3 pytest
      - run: python -m pytest test/ -q

  python-heavy:
    # nightly/manual only (#314): the per-push python job installs only
    # numpy+blake3, so test_import_roll's real-decode/detector class
    # self-skips — this run exercises it
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy blake3 pytest opencv-python-headless pillow tifffile
      - run: python -m pytest test/ -q
